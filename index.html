<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Интерактивный план участка</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #1e1e24;
      color: #f3f3f3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #2b2b36;
      padding-top: max(8px, env(safe-area-inset-top));
      padding-left: max(10px, env(safe-area-inset-left));
      padding-right: max(10px, env(safe-area-inset-right));
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #3d3d4e;
      z-index: 20;
      gap: 6px;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-btns {
      display: flex;
      gap: 5px;
      align-items: center;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 2px 0;
    }
    .header-btns::-webkit-scrollbar { display: none; }
    #sync-status {
      font-size: 11px;
      color: #81c784;
      font-weight: 500;
      white-space: nowrap;
      margin-right: 2px;
    }
    button {
      background: #4e6096;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
      touch-action: manipulation;
    }
    button:active { background: #3c4c78; }
    button.danger { background: #a84242; }
    button.success { background: #3e8e58; }
    button.toggle-on { background: #e5a93b; color: #111; font-weight: 600; }
    
    #viewport {
      flex: 1;
      position: relative;
      touch-action: none;
      background: #141418;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .toggle-toolbar-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 6;
      background: #3e8e58;
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
    }

    .toolbar {
      position: absolute;
      top: 50px;
      left: 10px;
      background: rgba(30, 30, 40, 0.96);
      backdrop-filter: blur(10px);
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #4a4a5e;
      display: none;
      flex-direction: column;
      gap: 6px;
      max-height: calc(100% - 130px);
      overflow-y: auto;
      z-index: 5;
      width: 195px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .toolbar.open { display: flex; }
    .toolbar-title {
      font-size: 10px;
      text-transform: uppercase;
      color: #aaa;
      font-weight: 700;
      margin-bottom: 2px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .toolbar-close {
      cursor: pointer;
      font-size: 14px;
      color: #aaa;
      padding: 0 4px;
    }
    .item-btn {
      background: #2c2c3a;
      color: #ddd;
      border: 1px solid #444456;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      text-align: left;
      cursor: pointer;
      touch-action: manipulation;
    }
    .item-btn:active { background: #4a4a60; }

    .bottom-panel {
      position: absolute;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 30, 40, 0.95);
      backdrop-filter: blur(8px);
      padding: 7px 12px;
      border-radius: 20px;
      border: 1px solid #444;
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 11px;
      z-index: 5;
      max-width: 94vw;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #selected-info {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 44vw;
    }
    .edit-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #2b2b36;
      border: 1px solid #555;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 30;
      display: none;
      width: 290px;
    }
    .edit-modal h3 { font-size: 14px; margin-bottom: 12px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 11px; color: #aaa; margin-bottom: 3px; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 6px 8px;
      background: #1b1b22;
      border: 1px solid #444;
      border-radius: 5px;
      color: white;
      font-size: 13px;
    }
    .form-group-checkbox { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .form-group-checkbox input { width: auto; }
    .modal-actions { display: flex; justify-content: space-between; margin-top: 14px; }
    .violation-badge { color: #ff5252; font-weight: 700; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <header>
    <h1>План участка</h1>
    <div class="header-btns">
      <span id="sync-status">🟢 Онлайн</span>
      <button onclick="saveToCloud(false)" class="success">💾 Сохранить</button>
      <button id="btn-norms" class="toggle-on" onclick="toggleNorms()">🛡 Нормы</button>
      <button onclick="resetCamera()">🎯 Центр</button>
      <button onclick="exportPNG()">📷 PNG</button>
    </div>
  </header>

  <div id="viewport">
    <canvas id="canvas"></canvas>

    <button id="toggle-toolbar-btn" class="toggle-toolbar-btn" onclick="toggleToolbar()">➕ Добавить</button>

    <div id="toolbar" class="toolbar">
      <div class="toolbar-title">
        <span>Объекты</span>
        <span class="toolbar-close" onclick="toggleToolbar()">✕</span>
      </div>
      <button class="item-btn" onclick="addNewObject('Дом', 'house', 10, 10, '#c25953')">🏠 Дом 10×10</button>
      <button class="item-btn" onclick="addNewObject('Септик', 'septic', 2.2, 1.4, '#4a6f9c', false)">💧 Септик 2.2×1.4</button>
      <button class="item-btn" onclick="addNewObject('Хозблок', 'shed', 4, 3, '#966d4e')">🪵 Хозблок 4×3</button>
      <button class="item-btn" onclick="addNewObject('Теплица', 'shed', 3, 6, '#4e8d96')">🌱 Теплица 3×6</button>
      <button class="item-btn" onclick="addNewObject('Беседка / Гриль', 'gazebo', 4, 4, '#8d6e63')">🛖 Беседка (мангал)</button>
      <button class="item-btn" onclick="addNewObject('Костровая зона', 'firepit', 5, 5, '#e65100', true)">🔥 Костровая Ø5м</button>
      <button class="item-btn" onclick="addNewObject('Бассейн', 'pool', 6, 3.5, '#0288d1', false)">🏊 Бассейн 6×3.5</button>
      <button class="item-btn" onclick="addNewObject('Компостер', 'compost', 1.26, 1.26, '#5d4037', true)">🍂 Компостер Ø1.26м</button>
      <button class="item-btn" onclick="addNewObject('Эл. щиток', 'electric', 0.4, 0.3, '#fbc02d', false)">⚡ Эл. щиток на столбе</button>
      <button class="item-btn" onclick="addNewObject('Дерево', 'tree', 3, 3, '#3e7a44', true)">🌳 Дерево Ø3м</button>
      <button class="item-btn" onclick="addNewObject('Куст', 'bush', 1.5, 1.5, '#66bb6a', true)">🌿 Куст Ø1.5м</button>
      <button class="item-btn" onclick="addNewObject('Грядка', 'garden', 1.2, 4, '#5b8c5a')">🥬 Грядка</button>
    </div>

    <div class="bottom-panel">
      <span id="selected-info">Нажмите на объект</span>
      <button id="lock-btn" style="display:none;" onclick="toggleSelectedLock()">🔒 Замок</button>
      <button id="edit-btn" style="display:none;" onclick="openEditModal()">Свойства</button>
      <button id="del-btn" style="display:none;" class="danger" onclick="deleteSelected()">Удалить</button>
    </div>

    <div id="editModal" class="edit-modal">
      <h3>Параметры объекта</h3>
      <div class="form-group">
        <label>Название</label>
        <input type="text" id="prop-name">
      </div>
      <div class="form-group">
        <label>Тип нормы</label>
        <select id="prop-type">
          <option value="shed">Хозблок / Теплица / Сарай (1м забор, 5м фасад)</option>
          <option value="house">Жилой дом (3м забор, 5м фасад, 8м баня)</option>
          <option value="banya">Баня (1м забор, 5м фасад, 8м дом, 5м костер)</option>
          <option value="garage">Гараж (3м фасад/забор)</option>
          <option value="gazebo">Беседка / Мангальная зона (1м забор, 5м фасад)</option>
          <option value="firepit">Костровая зона (2м забор, 5м до строений)</option>
          <option value="pool">Бассейн (2м забор, 5м фасад)</option>
          <option value="septic">Септик (2м забор, 5м фасад/дом, 15м колодец)</option>
          <option value="compost">Компостер (2м забор, 8м колодец/дом)</option>
          <option value="tree">Дерево (3м от ствола до забора, 5м дом)</option>
          <option value="bush">Куст (1м от центра до забора)</option>
          <option value="electric">Эл. щиток / Столб</option>
          <option value="gate">Ворота / Проезд</option>
          <option value="kolodets">Колодец (источник воды)</option>
          <option value="garden">Посадки / Зона сада</option>
        </select>
      </div>
      <div class="form-group">
        <label>Форма объекта</label>
        <select id="prop-shape" onchange="handleShapeChange()">
          <option value="rect">Прямоугольная (Ширина × Длина)</option>
          <option value="circle">Круглая (Диаметр)</option>
        </select>
      </div>
      <div class="form-group">
        <label id="label-prop-w">Ширина (м)</label>
        <input type="number" step="0.01" id="prop-w">
      </div>
      <div class="form-group" id="group-prop-h">
        <label id="label-prop-h">Длина / Глубина (м)</label>
        <input type="number" step="0.01" id="prop-h">
      </div>
      <div class="form-group">
        <label>Угол поворота (°)</label>
        <input type="number" step="5" id="prop-rot">
      </div>
      <div class="form-group-checkbox">
        <input type="checkbox" id="prop-locked">
        <label for="prop-locked">🔒 Заморозить (запретить перемещение)</label>
      </div>
      <div class="modal-actions">
        <button onclick="closeEditModal()">Отмена</button>
        <button class="success" onclick="applyEditModal()">Применить</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {

    const db = firebase.database();

    const syncStatusEl = document.getElementById('sync-status');
    function setSyncStatus(isSaving) {
      if (isSaving) {
        syncStatusEl.textContent = '🔄 Сохранение...';
        syncStatusEl.style.color = '#ffb74d';
      } else {
        syncStatusEl.textContent = '🟢 Онлайн';

      }
    }

    function toggleToolbar() {
      const tb = document.getElementById('toolbar');
      const btn = document.getElementById('toggle-toolbar-btn');
      const isOpen = tb.classList.toggle('open');
      btn.textContent = isOpen ? '✕ Закрыть' : '➕ Добавить';
      btn.style.background = isOpen ? '#616175' : '#3e8e58';
    }

    function handleShapeChange() {
      const shape = document.getElementById('prop-shape').value;
      const isCircle = shape === 'circle';
      const labelW = document.getElementById('label-prop-w');
      const groupH = document.getElementById('group-prop-h');
      
      if (isCircle) {
        labelW.textContent = 'Диаметр (м)';
        groupH.style.display = 'none';
      } else {
        labelW.textContent = 'Ширина (м)';
        groupH.style.display = 'block';
      }
    }

    let showNorms = true;
    function toggleNorms() {
      showNorms = !showNorms;
      const btn = document.getElementById('btn-norms');
      btn.textContent = showNorms ? '🛡 Нормы' : '🛡 Нормы: ВЫКЛ';
      btn.className = showNorms ? 'toggle-on' : '';
      draw();
    }

    const rawD = { x: 15.4693, y: 8.8298 };
    function toLocalCoord(pt) { return { x: pt.x - rawD.x, y: pt.y - rawD.y }; }

    const D = toLocalCoord(rawD);
    const C = toLocalCoord({ x: 51.8704, y: 8.8298 });
    const B = toLocalCoord({ x: 53.3275, y: 63.2881 });
    const A = toLocalCoord({ x: 16.4252, y: 62.4667 });

    const boundary = [D, C, B, A];
    function getDist(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }

    const distCD = getDist(C, D);
    const distBC = getDist(B, C);
    const distAB = getDist(A, B);
    const distDA = getDist(D, A);

    const plotCenter = {
      x: (A.x + B.x + C.x + D.x) / 4,
      y: (A.y + B.y + C.y + D.y) / 4
    };

    const NORMS = {
      house:    { fenceSide: 3.0, fenceFront: 5.0, fromEdge: true },
      banya:    { fenceSide: 1.0, fenceFront: 5.0, fromEdge: true },
      garage:   { fenceSide: 3.0, fenceFront: 3.0, fromEdge: true },
      gazebo:   { fenceSide: 1.0, fenceFront: 5.0, fromEdge: true },
      firepit:  { fenceSide: 2.0, fenceFront: 5.0, fromEdge: true },
      pool:     { fenceSide: 2.0, fenceFront: 5.0, fromEdge: true },
      septic:   { fenceSide: 2.0, fenceFront: 5.0, fromEdge: true },
      compost:  { fenceSide: 2.0, fenceFront: 5.0, fromEdge: true },
      shed:     { fenceSide: 1.0, fenceFront: 5.0, fromEdge: true },
      tree:     { fenceSide: 3.0, fenceFront: 3.0, fromEdge: false },
      bush:     { fenceSide: 1.0, fenceFront: 1.0, fromEdge: false },
      electric: { fenceSide: 0.0, fenceFront: 0.0, fromEdge: true },
      kolodets: { fenceSide: 0.0, fenceFront: 0.0, fromEdge: true },
      gate:     { fenceSide: 0.0, fenceFront: 0.0, fromEdge: true },
      garden:   { fenceSide: 0.0, fenceFront: 0.0, fromEdge: false }
    };

    const fencePosts = [];
    function generateFencePosts() {
      fencePosts.length = 0;
      function placeSegment(startPt, endPt, step) {
        const len = getDist(startPt, endPt);
        const dx = (endPt.x - startPt.x) / len;
        const dy = (endPt.y - startPt.y) / len;
        fencePosts.push({ x: startPt.x, y: startPt.y, isCorner: true });
        let dist = step;
        while (dist < len - 0.05) {
          fencePosts.push({ x: startPt.x + dx * dist, y: startPt.y + dy * dist, isCorner: false });
          dist += step;
        }
      }
      placeSegment(D, C, 5.76);
      placeSegment(C, B, 5.76);
      placeSegment(A, B, 5.76);
      fencePosts.push({ x: B.x, y: B.y, isCorner: true });
      const lenDA = getDist(D, A);
      const dxDA = (A.x - D.x) / lenDA;
      const dyDA = (A.y - D.y) / lenDA;
      let distDA_step = 3.0;
      while (distDA_step < lenDA - 0.05) {
        fencePosts.push({ x: D.x + dxDA * distDA_step, y: D.y + dyDA * distDA_step, isCorner: false });
        distDA_step += 3.0;
      }
    }
    generateFencePosts();

    const gardenPolygonPts = [
      toLocalCoord({ x: 16.4252, y: 62.4667 }),
      toLocalCoord({ x: 33.7608, y: 62.8545 }),
      toLocalCoord({ x: 33.5097, y: 48.7548 }),
      toLocalCoord({ x: 16.1739, y: 48.3689 })
    ];

      x: gardenPolygonPts.reduce((s, p) => s + p.x, 0) / 4,
      y: gardenPolygonPts.reduce((s, p) => s + p.y, 0) / 4
    };

        h: 3.0,
        rot: 0,
        color: '#2e7d32',
        isCircle: true,
        locked: false
      },
      {
        id: 1787572832643,
        name: 'Дом',
        normType: 'house',
        x: 19,
        y: 32,
        w: 6,
        h: 4,
        rot: 0,
        color: '#c25953',
        isCircle: false,
        locked: false
      }
    ];

    let objects = [...defaultObjects];
    let scale = 12;
    let pan = { x: 0, y: 0 };
    let selectedObj = null;
    let isDraggingObj = false;
    let dragOffset = { x: 0, y: 0 };
    let isPanning = false;
    let startPan = { x: 0, y: 0 };
    let initialPinchDist = null;
    let initialScale = scale;

    function saveToCloud(silent = false) {
      setSyncStatus(true);
      plotRef.set(objects)
        .then(() => {
          setSyncStatus(false);
          if (!silent) alert('План успешно сохранен в Firebase!');
        })
        .catch(err => {
          console.error("Ошибка Firebase:", err);
          syncStatusEl.textContent = '❌ Ошибка сети';
          syncStatusEl.style.color = '#ef5350';
          if (!silent) alert('Ошибка при сохранении: ' + err.message);
        });
    }

    plotRef.on('value', (snapshot) => {
      const cloudData = snapshot.val();
      if (cloudData && Array.isArray(cloudData)) {
        objects = cloudData.map(o => {
          if (o.normType === 'septic' && o.isCircle === undefined) {
            o.isCircle = false;
            if (!o.w) o.w = 2.2;
            if (!o.h) o.h = 1.4;
          }
          if (o.normType === 'compost' && o.isCircle === undefined) {
            o.isCircle = true;
            o.w = 1.26;
            o.h = 1.26;
          }
          return o;
        });

        if (!objects.some(o => o.normType === 'compost')) {
          const compDefault = defaultObjects.find(d => d.normType === 'compost');
          if (compDefault) objects.push(compDefault);
        }

        if (selectedObj) {
          selectedObj = objects.find(o => o.id === selectedObj.id) || null;
        }
        updateSelectionUI();
        draw();
      } else if (!cloudData) {
        plotRef.set(defaultObjects);
      }
    });

    function resize() {
      canvas.width = viewport.clientWidth * window.devicePixelRatio;
      canvas.height = viewport.clientHeight * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      draw();
    }
    window.addEventListener('resize', resize);

    function resetCamera() {
      const w = viewport.clientWidth;
      const h = viewport.clientHeight;
      scale = Math.min(w / 48, h / 70);
      pan.x = w / 2 - plotCenter.x * scale;
      pan.y = h * 0.85;
      draw();
    }

    function toScreen(pt) { return { x: pan.x + pt.x * scale, y: pan.y - pt.y * scale }; }
    function toWorld(pt) { return { x: (pt.x - pan.x) / scale, y: (pan.y - pt.y) / scale }; }

    function distToSegment(p, v, w) {
      const l2 = (w.x - v.x) ** 2 + (w.y - v.y) ** 2;
      if (l2 === 0) return getDist(p, v);
      let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      return getDist(p, { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) });
    }

    function getEdgeDist(o1, o2) {
      const d = getDist(o1, o2);
      const r1 = o1.isCircle ? (o1.w / 2) : (Math.max(o1.w, o1.h) / 2);
      const r2 = o2.isCircle ? (o2.w / 2) : (Math.max(o2.w, o2.h) / 2);
      return Math.max(0, d - r1 - r2);
    }

    function checkNorms(obj) {
      const norm = NORMS[obj.normType || 'shed'];
      if (!norm || obj.normType === 'garden' || obj.normType === 'gate' || obj.normType === 'electric') return { ok: true, violations: [] };

      const violations = [];
      const offset = norm.fromEdge ? (obj.isCircle ? (obj.w / 2) : (Math.max(obj.w, obj.h) / 2)) : 0;

      // 1. Отступ до фасада CD
      const distFront = distToSegment(obj, D, C) - offset;
      if (norm.fenceFront && distFront < norm.fenceFront - 0.05) {
        violations.push(`Фасад CD: ${Math.max(0, distFront).toFixed(2)}м (норма $\ge${norm.fenceFront}$м)`);
      }

      // 2. Отступы до заборов
      const distDA = distToSegment(obj, D, A) - offset;
      const distAB = distToSegment(obj, A, B) - offset;
      const distBC = distToSegment(obj, B, C) - offset;
      const minSideFence = Math.min(distDA, distAB, distBC);

      if (norm.fenceSide && minSideFence < norm.fenceSide - 0.05) {
        violations.push(`Забор: ${Math.max(0, minSideFence).toFixed(2)}м (норма $\ge${norm.fenceSide}$м)`);
      }

      // 3. КОСТРОВАЯ ЗОНА (firepit) -> строения (>= 5м) и деревья (>= 3м)
      if (obj.normType === 'firepit') {
        const buildings = objects.filter(o => o !== obj && ['house', 'banya', 'shed', 'gazebo', 'garage'].includes(o.normType));
        buildings.forEach(b => {
          const eDist = getEdgeDist(obj, b);
          if (eDist < 5.0) {
            violations.push(`До строения "${b.name}": ${eDist.toFixed(1)}м (норма МЧС $\ge5$м)`);
          }
        });
        const trees = objects.filter(o => o !== obj && o.normType === 'tree');
        trees.forEach(t => {
          const eDist = getEdgeDist(obj, t);
          if (eDist < 3.0) {
            violations.push(`До дерева "${t.name}": ${eDist.toFixed(1)}м (норма $\ge3$м)`);
          }
        });
      }

      if (['house', 'banya', 'shed', 'gazebo', 'garage'].includes(obj.normType)) {
        const firepits = objects.filter(o => o.normType === 'firepit');
        firepits.forEach(f => {
          const eDist = getEdgeDist(obj, f);
          if (eDist < 5.0) {
            violations.push(`До костровой зоны: ${eDist.toFixed(1)}м (норма МЧС $\ge5$м)`);
          }
        });
      }

      // 4. СЕПТИК -> колодец (>=15м), дом (>=5м)
      if (obj.normType === 'septic') {
        const kol = objects.find(o => o.normType === 'kolodets');
        if (kol) {
          const dKol = getDist(obj, kol);
          if (dKol < 15.0) violations.push(`До колодца: ${dKol.toFixed(1)}м (норма $\ge15$м)`);
        }
        const houses = objects.filter(o => o.normType === 'house');
        houses.forEach(h => {
          const eDist = getEdgeDist(obj, h);
          if (eDist < 5.0) violations.push(`До дома: ${eDist.toFixed(1)}м (норма $\ge5$м)`);
        });
      }

      // 5. КОМПОСТЕР -> колодец (>=8м), дом (>=8м)
      if (obj.normType === 'compost') {
        const kol = objects.find(o => o.normType === 'kolodets');
        if (kol) {
          const dKol = getDist(obj, kol);
          if (dKol < 8.0) violations.push(`До колодца: ${dKol.toFixed(1)}м (норма $\ge8$м)`);
        }
        const houses = objects.filter(o => o.normType === 'house');
        houses.forEach(h => {
          const eDist = getEdgeDist(obj, h);
          if (eDist < 8.0) violations.push(`До дома: ${eDist.toFixed(1)}м (норма $\ge8$м)`);
        });
      }

      // 6. ДОМ <-> БАНЯ (>= 8м)
      if (obj.normType === 'house') {
        const ban = objects.find(o => o.normType === 'banya');
        if (ban) {
          const eDist = getEdgeDist(obj, ban);
          if (eDist < 8.0) violations.push(`До бани: ${eDist.toFixed(1)}м (норма $\ge8$м)`);
        }
      }
      if (obj.normType === 'banya') {
        const h = objects.find(o => o.normType === 'house');
        if (h) {
          const eDist = getEdgeDist(obj, h);
          if (eDist < 8.0) violations.push(`До дома: ${eDist.toFixed(1)}м (норма $\ge8$м)`);
        }
      }

      // 7. ДЕРЕВО -> ДОМ (>= 5м)
      if (obj.normType === 'tree') {
        const houses = objects.filter(o => o.normType === 'house');
        houses.forEach(h => {
          const eDist = getEdgeDist(obj, h);
          if (eDist < 5.0) violations.push(`До дома: ${eDist.toFixed(1)}м (норма $\ge5$м)`);
        });
      }

      return { ok: violations.length === 0, violations };
    }

    function draw() {
      const w = viewport.clientWidth;
      const h = viewport.clientHeight;
      ctx.clearRect(0, 0, w, h);

      drawGrid();

      ctx.beginPath();
      const pD = toScreen(D);
      ctx.moveTo(pD.x, pD.y);
      [C, B, A].forEach(p => { const sp = toScreen(p); ctx.lineTo(sp.x, sp.y); });
      ctx.closePath();
      ctx.fillStyle = 'rgba(76, 120, 74, 0.28)';
      ctx.fill();
      ctx.strokeStyle = '#5da859';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      const pC = toScreen(C);
      ctx.beginPath();
      ctx.moveTo(pD.x, pD.y);
      ctx.lineTo(pC.x, pC.y);
      ctx.strokeStyle = '#ffc83b';
      ctx.lineWidth = 4;
      ctx.stroke();

      if (showNorms) {
        const kol = objects.find(o => o.normType === 'kolodets');
        if (kol) {
          ctx.save();
          const scKol = toScreen(kol);
          ctx.beginPath();
          ctx.arc(scKol.x, scKol.y, 15 * scale, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(74, 111, 156, 0.08)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(74, 111, 156, 0.4)';
          ctx.setLineDash([4, 4]);
          ctx.stroke();
          ctx.fillStyle = 'rgba(120, 170, 230, 0.8)';
          ctx.font = '10px sans-serif';
          ctx.fillText('Охранная зона колодца (R=15м)', scKol.x, scKol.y + 15 * scale + 12);
          ctx.restore();
        }
      }

      fencePosts.forEach(post => {
        const sp = toScreen(post);
        const postVisualSize = Math.max(4, 0.06 * scale);
        ctx.save();
        if (post.isCorner) {
          ctx.fillStyle = '#ff5252';
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.2;
        } else {
          ctx.fillStyle = '#e0e0e0';
          ctx.strokeStyle = '#222222';
          ctx.lineWidth = 1;
        }
        ctx.fillRect(sp.x - postVisualSize / 2, sp.y - postVisualSize / 2, postVisualSize, postVisualSize);
        ctx.strokeRect(sp.x - postVisualSize / 2, sp.y - postVisualSize / 2, postVisualSize, postVisualSize);
        ctx.restore();
      });

      drawPlotLabels();

      objects.forEach(obj => {
        const normCheck = checkNorms(obj);
        const norm = NORMS[obj.normType || 'shed'];

        if (showNorms && norm && norm.fenceSide > 0 && !obj.isZone) {
          ctx.save();
          const pos = toScreen(obj);
          ctx.translate(pos.x, pos.y);
          ctx.rotate((-obj.rot * Math.PI) / 180);

          if (normCheck.ok) {
            ctx.fillStyle = 'rgba(76, 175, 80, 0.12)';
            ctx.strokeStyle = 'rgba(76, 175, 80, 0.5)';
          } else {
            ctx.fillStyle = 'rgba(244, 67, 54, 0.22)';
            ctx.strokeStyle = 'rgba(244, 67, 54, 0.8)';
          }

          ctx.setLineDash([4, 4]);
          ctx.lineWidth = 1.2;

          if (obj.isCircle) {
            const normRad = (obj.w / 2 + norm.fenceSide) * scale;
            ctx.beginPath();
            ctx.arc(0, 0, normRad, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          } else {
            const rw = (obj.w + norm.fenceSide * 2) * scale;
            const rh = (obj.h + norm.fenceSide * 2) * scale;
            ctx.fillRect(-rw / 2, -rh / 2, rw, rh);
            ctx.strokeRect(-rw / 2, -rh / 2, rw, rh);
          }
          ctx.restore();
        }

        if (obj.pts && obj.isZone) {
          ctx.save();
          ctx.beginPath();
          const first = toScreen(obj.pts[0]);
          ctx.moveTo(first.x, first.y);
          for (let i = 1; i < obj.pts.length; i++) {
            const sp = toScreen(obj.pts[i]);
            ctx.lineTo(sp.x, sp.y);
          }
          ctx.closePath();
          ctx.fillStyle = obj.color;
          ctx.fill();

          ctx.setLineDash([6, 4]);
          ctx.strokeStyle = obj === selectedObj ? '#ffffff' : '#4caf50';
          ctx.lineWidth = 1.8;
          ctx.stroke();

          const scCenter = toScreen({ x: obj.x, y: obj.y });
          const title = obj.locked ? `🔒 ${obj.name}` : obj.name;
          ctx.fillStyle = '#a5d6a7';
          ctx.font = 'italic bold 11px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(title, scCenter.x, scCenter.y);
          ctx.restore();
          return;
        }

        ctx.save();
        const pos = toScreen(obj);
        ctx.translate(pos.x, pos.y);
        ctx.rotate((-obj.rot * Math.PI) / 180);

        const rw = obj.w * scale;
        const rh = (obj.isCircle ? obj.w : obj.h) * scale;

        ctx.fillStyle = obj.color;

        if (!normCheck.ok && showNorms) {
          ctx.strokeStyle = '#ff3838';
          ctx.lineWidth = 3;
        } else if (obj === selectedObj) {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2.5;
        } else if (obj.locked) {
          ctx.strokeStyle = '#ffd54f';
          ctx.lineWidth = 1.6;
        } else {
          ctx.strokeStyle = 'rgba(0,0,0,0.45)';
          ctx.lineWidth = 1;
        }

        if (obj.normType === 'firepit') {
          ctx.beginPath();
          ctx.arc(0, 0, rw / 2, 0, Math.PI * 2);
          ctx.fillStyle = '#424242';
          ctx.fill();
          ctx.stroke();
          
          ctx.beginPath();
          ctx.arc(0, 0, Math.max(3, rw / 5), 0, Math.PI * 2);
          ctx.fillStyle = '#ff6f00';
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1;
          ctx.stroke();
        } else if (obj.isCircle) {
          ctx.beginPath();
          ctx.arc(0, 0, rw / 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          if (obj.normType === 'tree') {
            ctx.beginPath();
            ctx.arc(0, 0, Math.max(2, rw / 6), 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fill();
          }
        } else {
          ctx.fillRect(-rw / 2, -rh / 2, rw, rh);
          ctx.strokeRect(-rw / 2, -rh / 2, rw, rh);
        }

        const title = obj.locked ? `🔒 ${obj.name}` : obj.name;
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(title, 0, 0);

        ctx.restore();
      });
    }

    function drawGrid() {
      const step = 5 * scale;
      const subStep = 1 * scale;
      ctx.strokeStyle = '#1d1d24'; ctx.lineWidth = 0.5;
      for (let x = pan.x % subStep; x < viewport.clientWidth; x += subStep) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, viewport.clientHeight); ctx.stroke();
      }
      for (let y = pan.y % subStep; y < viewport.clientHeight; y += subStep) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(viewport.clientWidth, y); ctx.stroke();
      }
      ctx.strokeStyle = '#2b2b38'; ctx.lineWidth = 1;
      for (let x = pan.x % step; x < viewport.clientWidth; x += step) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, viewport.clientHeight); ctx.stroke();
      }
      for (let y = pan.y % step; y < viewport.clientHeight; y += step) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(viewport.clientWidth, y); ctx.stroke();
      }
    }

    function drawPlotLabels() {
      ctx.font = 'bold 12px sans-serif';
      ctx.fillStyle = '#fffae0';
      const labels = [
        { pt: D, text: 'D', off: { x: -18, y: 16 } },
        { pt: C, text: 'C', off: { x: 8, y: 16 } },
        { pt: B, text: 'B', off: { x: 10, y: -8 } },
        { pt: A, text: 'A', off: { x: -18, y: -8 } }
      ];
      labels.forEach(l => {
        const p = toScreen(l.pt);
        ctx.fillText(l.text, p.x + l.off.x, p.y + l.off.y);
      });

      ctx.font = '11px sans-serif';
      ctx.fillStyle = '#ffc83b';
      const pCD = toScreen({ x: (C.x + D.x) / 2, y: (C.y + D.y) / 2 });
      ctx.fillText(`CD: ${distCD.toFixed(2)} м (Фасад)`, pCD.x - 45, pCD.y + 18);

      ctx.fillStyle = '#a9dfa7';
      const pDA = toScreen({ x: (D.x + A.x) / 2, y: (D.y + A.y) / 2 });
      ctx.fillText(`DA: ${distDA.toFixed(2)} м`, pDA.x - 65, pDA.y);

      const pBC = toScreen({ x: (B.x + C.x) / 2, y: (B.y + C.y) / 2 });
      ctx.fillText(`BC: ${distBC.toFixed(2)} м`, pBC.x + 8, pBC.y);

      const pAB = toScreen({ x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 });
      ctx.fillText(`AB: ${distAB.toFixed(2)} м`, pAB.x - 30, pAB.y - 12);
    }

    function getEventPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function findObjectAt(screenPos) {
      const worldPos = toWorld(screenPos);
      for (let i = objects.length - 1; i >= 0; i--) {
        const obj = objects[i];
        if (obj.pts && obj.isZone) {
          let inside = false;
          for (let j = 0, k = obj.pts.length - 1; j < obj.pts.length; k = j++) {
            const xi = obj.pts[j].x, yi = obj.pts[j].y;
            const xj = obj.pts[k].x, yj = obj.pts[k].y;
            const intersect = ((yi > worldPos.y) !== (yj > worldPos.y))
                && (worldPos.x < (xj - xi) * (worldPos.y - yi) / (yj - yi) + xi);
            if (intersect) inside = !inside;
          }
          if (inside) return obj;
        } else if (obj.isCircle) {
          const dx = worldPos.x - obj.x;
          const dy = worldPos.y - obj.y;
          if (Math.hypot(dx, dy) <= obj.w / 2) return obj;
        } else {
          const dx = worldPos.x - obj.x;
          const dy = worldPos.y - obj.y;
          if (Math.abs(dx) <= obj.w / 2 && Math.abs(dy) <= obj.h / 2) return obj;
        }
      }
      return null;
    }

    function handlePointerDown(e) {
      if (e.touches && e.touches.length === 2) {
        isPanning = false;
        isDraggingObj = false;
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = scale;
        return;
      }

      const pos = getEventPos(e);
      const clicked = findObjectAt(pos);

      if (clicked) {
        selectedObj = clicked;
        if (!clicked.locked) {
          isDraggingObj = true;
          dragOffset = { x: clicked.x - toWorld(pos).x, y: clicked.y - toWorld(pos).y };
        } else {
          isDraggingObj = false;
        }
        updateSelectionUI();
      } else {
        selectedObj = null;
        updateSelectionUI();
        isPanning = true;
        startPan = { x: pos.x - pan.x, y: pos.y - pan.y };
      }
      draw();
    }

    function handlePointerMove(e) {
      if (e.touches && e.touches.length === 2 && initialPinchDist) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        scale = Math.max(4, Math.min(50, initialScale * (dist / initialPinchDist)));
        draw();
        return;
      }

      const pos = getEventPos(e);

      if (isDraggingObj && selectedObj && !selectedObj.locked) {
        const wPos = toWorld(pos);
        const newX = Math.round((wPos.x + dragOffset.x) * 2) / 2;
        const newY = Math.round((wPos.y + dragOffset.y) * 2) / 2;
        const dx = newX - selectedObj.x;
        const dy = newY - selectedObj.y;
        
        selectedObj.x = newX;
        selectedObj.y = newY;
        if (selectedObj.pts) {
          selectedObj.pts = selectedObj.pts.map(p => ({ x: p.x + dx, y: p.y + dy }));
        }

        updateSelectionUI();
        draw();
      } else if (isPanning) {
        pan.x = pos.x - startPan.x;
        pan.y = pos.y - startPan.y;
        draw();
      }
    }

    function handlePointerUp() {
      if (isDraggingObj) {
        saveToCloud(true);
      }
      isDraggingObj = false;
      isPanning = false;
      initialPinchDist = null;
    }

    canvas.addEventListener('mousedown', handlePointerDown);
    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mouseup', handlePointerUp);

    canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
    window.addEventListener('touchmove', handlePointerMove, { passive: false });
    window.addEventListener('touchend', handlePointerUp);

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const mousePos = getEventPos(e);
      const worldPos = toWorld(mousePos);
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      scale = Math.max(4, Math.min(50, scale * zoomFactor));
      pan.x = mousePos.x - worldPos.x * scale;
      pan.y = mousePos.y + worldPos.y * scale;
      draw();
    }, { passive: false });

    function toggleSelectedLock() {
      if (!selectedObj) return;
      selectedObj.locked = !selectedObj.locked;
      updateSelectionUI();
      draw();
      saveToCloud(true);
    }

    function updateSelectionUI() {
      const info = document.getElementById('selected-info');
      const lockBtn = document.getElementById('lock-btn');
      const editBtn = document.getElementById('edit-btn');
      const delBtn = document.getElementById('del-btn');

      if (selectedObj) {
        const normCheck = checkNorms(selectedObj);
        const lockStatus = selectedObj.locked ? '🔒 (Заморожен)' : '';
        if (normCheck.ok || !showNorms) {
          info.innerHTML = `<b>${selectedObj.name}</b> ${lockStatus} | X=${selectedObj.x.toFixed(1)}м, Y=${selectedObj.y.toFixed(1)}м`;
        } else {
          info.innerHTML = `⚠️ <span class="violation-badge">Нарушение:</span> ${normCheck.violations.join('; ')}`;
        }
        
        lockBtn.style.display = 'inline-block';
        lockBtn.textContent = selectedObj.locked ? '🔓 Разморозить' : '🔒 Заморозить';
        editBtn.style.display = 'inline-block';
        delBtn.style.display = 'inline-block';
      } else {
        info.textContent = 'Нажмите на любой объект для настройки';
        lockBtn.style.display = 'none';
        editBtn.style.display = 'none';
        delBtn.style.display = 'none';
      }
    }

    function addNewObject(name, normType, w, h, color, isCircle = false) {
      const obj = {
        id: Date.now(),
        name,
        normType,
        w,
        h: isCircle ? w : h,
        x: Math.round(plotCenter.x),
        y: Math.round(plotCenter.y),
        rot: 0,
        color,
        isCircle: (normType === 'tree' || normType === 'bush' || normType === 'firepit' || normType === 'compost') ? true : isCircle,
        locked: false
      };
      objects.push(obj);
      selectedObj = obj;
      updateSelectionUI();
      draw();
      saveToCloud(true);
      
      const tb = document.getElementById('toolbar');
      if (tb.classList.contains('open')) {
        toggleToolbar();
      }
    }

    function deleteSelected() {
      if (!selectedObj) return;
      objects = objects.filter(o => o !== selectedObj);
      selectedObj = null;
      updateSelectionUI();
      draw();
      saveToCloud(true);
    }

    function openEditModal() {
      if (!selectedObj) return;
      document.getElementById('prop-name').value = selectedObj.name;
      document.getElementById('prop-type').value = selectedObj.normType || 'shed';
      document.getElementById('prop-shape').value = selectedObj.isCircle ? 'circle' : 'rect';
      document.getElementById('prop-w').value = selectedObj.w;
      document.getElementById('prop-h').value = selectedObj.h || selectedObj.w;
      document.getElementById('prop-rot').value = selectedObj.rot || 0;
      document.getElementById('prop-locked').checked = !!selectedObj.locked;
      handleShapeChange();
      document.getElementById('editModal').style.display = 'block';
    }

    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    function applyEditModal() {
      if (!selectedObj) return;
      selectedObj.name = document.getElementById('prop-name').value;
      selectedObj.normType = document.getElementById('prop-type').value;
      const isCircle = document.getElementById('prop-shape').value === 'circle';
      selectedObj.isCircle = isCircle;
      
      const valW = parseFloat(document.getElementById('prop-w').value) || 1;
      selectedObj.w = valW;
      selectedObj.h = isCircle ? valW : (parseFloat(document.getElementById('prop-h').value) || 1);
      
      selectedObj.rot = parseFloat(document.getElementById('prop-rot').value) || 0;
      selectedObj.locked = document.getElementById('prop-locked').checked;
      
      closeEditModal();
      updateSelectionUI();
      draw();
      saveToCloud(true);
    }

    function exportPNG() {
      const link = document.createElement('a');
      link.download = 'plot-plan.png';
      link.href = canvas.toDataURL();
      link.click();
    }

    setTimeout(() => {
      resize();
      resetCamera();
    }, 100);
  </script>
</body>
</html>
